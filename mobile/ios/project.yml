name: DeviceMesh
targets:
  DeviceMesh:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.davidegeacalatayud.devicemesh
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Resources/DeviceMesh.entitlements
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
  DeviceMeshTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
        excludes:
          - "**/*.md"
    dependencies:
      - target: DeviceMesh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.davidegeacalatayud.devicemesh.tests
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: YES

  DeviceMeshUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
        excludes:
          - "**/*.md"
    dependencies:
      - target: DeviceMesh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.davidegeacalatayud.devicemesh.uitests
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DeviceMesh

schemes:
  DeviceMesh:
    build:
      targets:
        DeviceMesh: all
    test:
      targets:
        - DeviceMeshTests
        - DeviceMeshUITests
    run:
      config: Debug
    archive:
      config: Release
