name: DeviceMesh
targets:
  DeviceMesh:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.davidegeacalatayud.devicemesh
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
  DeviceMeshTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
        excludes:
          - "**/*.md"
    dependencies:
      - target: DeviceMesh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.davidegeacalatayud.devicemesh.tests
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: YES

  DeviceMeshUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: DeviceMesh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.davidegeacalatayud.devicemesh.uitests
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DeviceMesh:
    build:
      targets:
        DeviceMesh: all
    test:
      targets:
        - DeviceMeshTests
        - DeviceMeshUITests
    run:
      config: Debug
    archive:
      config: Release
