name: DeviceMesh
packages:
  ESPProvision:
    url: https://github.com/espressif/esp-idf-provisioning-ios.git
    from: 2.1.1
targets:
  DeviceMesh:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - "**/*.md"
    dependencies:
      - package: ESPProvision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.davidegeacalatayud.devicemesh
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "DeviceMesh uses Bluetooth to securely provision DeviceMesh hardware."
  DeviceMeshTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
        excludes:
          - "**/*.md"
    dependencies:
      - target: DeviceMesh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.davidegeacalatayud.devicemesh.tests
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: YES
