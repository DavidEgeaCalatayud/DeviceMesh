name: Feature request
description: Propose a product or engineering capability
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: What user or engineering problem should be solved?}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed outcome, description: Describe behavior rather than implementation where possible.}
    validations: {required: true}
  - type: textarea
    id: tradeoffs
    attributes: {label: Trade-offs / alternatives}
