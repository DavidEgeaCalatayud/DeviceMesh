name: Bug report
description: Report a reproducible DeviceMesh defect
title: "bug: "
body:
  - type: textarea
    id: summary
    attributes: {label: Summary, description: What happened?}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction, description: Minimal steps and relevant component/version}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Logs / diagnostics, description: Remove secrets and private network data before posting.}
