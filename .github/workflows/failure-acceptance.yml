name: Failure acceptance

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/**"
      - "tools/deployment/**"
      - ".github/workflows/failure-acceptance.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-failure-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Install acceptance client dependencies
        run: python -m pip install --disable-pip-version-check "httpx>=0.27,<1" "websockets>=13,<16"
      - name: Execute production failure matrix
        run: bash tools/deployment/failure-acceptance.sh
      - name: Diagnostics
        if: failure()
        run: |
          docker compose --project-directory . --env-file .env.production \
            -f infra/docker/docker-compose.prod.yml \
            -f infra/docker/failure.override.yml ps || true
          docker compose --project-directory . --env-file .env.production \
            -f infra/docker/docker-compose.prod.yml \
            -f infra/docker/failure.override.yml logs --tail 150 || true
