name: macOS Agent CI
on:
  push:
    branches: [main]
    paths:
      - "agents/macos/**"
      - ".github/workflows/macos-agent-ci.yml"
  pull_request:
    paths:
      - "agents/macos/**"
      - ".github/workflows/macos-agent-ci.yml"

jobs:
  macos-agent:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: agents/macos
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build release with warnings as errors
        run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Run tests
        run: swift test
      - name: Validate launchd plist
        run: plutil -lint launchd/io.github.davidegeacalatayud.devicemesh.macos-agent.plist
      - name: Verify LaunchAgent uses unified logging
        run: |
          ! grep -q "StandardOutPath\|StandardErrorPath" launchd/io.github.davidegeacalatayud.devicemesh.macos-agent.plist
