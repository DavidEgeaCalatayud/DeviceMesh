name: Long soak acceptance

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: Sustained soak duration
        required: true
        default: "24"
        type: choice
        options: ["24", "48"]
      devices:
        description: Concurrent enrolled agents
        required: true
        default: "1000"
        type: choice
        options: ["100", "1000"]

permissions:
  contents: read

jobs:
  soak:
    runs-on: [self-hosted, linux, devicemesh-soak]
    env:
      DEVICEMESH_OPERATOR_TOKEN: ${{ secrets.DEVICEMESH_SOAK_OPERATOR_TOKEN }}
      DEVICEMESH_DATABASE_URL: ${{ secrets.DEVICEMESH_SOAK_DATABASE_URL }}
      DEVICEMESH_REDIS_URL: ${{ secrets.DEVICEMESH_SOAK_REDIS_URL }}
      DEVICEMESH_API_METRICS_URL: ${{ secrets.DEVICEMESH_SOAK_API_METRICS_URL }}
      DEVICEMESH_WORKER_METRICS_URL: ${{ secrets.DEVICEMESH_SOAK_WORKER_METRICS_URL }}
      DEVICEMESH_WEBSOCKET_URL: ${{ secrets.DEVICEMESH_SOAK_WEBSOCKET_URL }}
      DEVICEMESH_SOAK_BASE_URL: ${{ secrets.DEVICEMESH_SOAK_BASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Require isolated soak environment
        run: |
          test -n "$DEVICEMESH_OPERATOR_TOKEN"
          test -n "$DEVICEMESH_DATABASE_URL"
          test -n "$DEVICEMESH_REDIS_URL"
          test -n "$DEVICEMESH_API_METRICS_URL"
          test -n "$DEVICEMESH_WORKER_METRICS_URL"
          test -n "$DEVICEMESH_WEBSOCKET_URL"
          test -n "$DEVICEMESH_SOAK_BASE_URL"
      - name: Install benchmark dependencies
        run: python -m pip install --disable-pip-version-check -e backend
      - name: Run sustained authenticated soak
        run: |
          python tools/benchmarking/soak.py \
            --server "$DEVICEMESH_SOAK_BASE_URL" \
            --duration-hours "${{ inputs.duration_hours }}" \
            --devices "${{ inputs.devices }}" \
            --concurrency 100 \
            --interval-seconds 30 \
            --api-metrics-url "$DEVICEMESH_API_METRICS_URL" \
            --worker-metrics-url "$DEVICEMESH_WORKER_METRICS_URL" \
            --redis-url "$DEVICEMESH_REDIS_URL" \
            --websocket-url "$DEVICEMESH_WEBSOCKET_URL" \
            --output-dir "artifacts/soak-${{ inputs.duration_hours }}h-${{ inputs.devices }}"
      - name: Upload retained soak evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soak-${{ inputs.duration_hours }}h-${{ inputs.devices }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
