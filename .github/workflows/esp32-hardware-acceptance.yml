name: ESP32 Hardware Acceptance

on:
  workflow_dispatch:
    inputs:
      serial_port:
        description: Serial port of the attached reference ESP32
        required: true
        default: /dev/ttyUSB0
      target:
        description: ESP-IDF target
        required: true
        default: esp32

permissions:
  contents: read

jobs:
  physical:
    runs-on: [self-hosted, devicemesh-esp32]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build reference firmware
        working-directory: firmware/esp32
        run: |
          idf.py set-target "${{ inputs.target }}"
          idf.py build
      - name: Flash reference board
        working-directory: firmware/esp32
        run: idf.py -p "${{ inputs.serial_port }}" flash
      - name: Validate boot and crash-free serial contract
        run: |
          python -m pip install pyserial==3.5
          python tools/hardware/esp32_acceptance.py \
            --port "${{ inputs.serial_port }}" \
            --timeout-seconds 120
