name: Windows Agent CI
on:
  push:
    branches: [main]
    paths: ["agents/windows/**", "protocol/**", ".github/workflows/windows-agent-ci.yml"]
  pull_request:
    paths: ["agents/windows/**", "protocol/**", ".github/workflows/windows-agent-ci.yml"]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: {dotnet-version: "8.0.x"}
      - run: dotnet restore agents/windows/DeviceMesh.Agent.sln
      - run: dotnet build agents/windows/DeviceMesh.Agent.sln --configuration Release --no-restore
      - run: dotnet test agents/windows/DeviceMesh.Agent.sln --configuration Release --no-build
