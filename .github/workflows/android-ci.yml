name: Android CI
on:
  push:
    paths: ["mobile/android/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["mobile/android/**", ".github/workflows/android-ci.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with: {gradle-version: "8.9"}
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-35"             "build-tools;35.0.0"             "emulator"             "system-images;android-35;google_apis;x86_64"
      - working-directory: mobile/android
        run: gradle :core:network:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease
      - name: Start Android 35 emulator
        run: |
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd             --force --name devicemesh-ci             --package "system-images;android-35;google_apis;x86_64"
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          nohup "$ANDROID_HOME/emulator/emulator"             -avd devicemesh-ci             -no-window -no-audio -no-boot-anim             -gpu swiftshader_indirect             > /tmp/devicemesh-emulator.log 2>&1 &
          adb wait-for-device
          for attempt in {1..90}; do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              break
            fi
            if [[ "$attempt" == 90 ]]; then
              cat /tmp/devicemesh-emulator.log
              exit 1
            fi
            sleep 2
          done
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Run Android UI tests
        working-directory: mobile/android
        run: gradle :app:connectedDebugAndroidTest
      - if: failure()
        run: cat /tmp/devicemesh-emulator.log 2>/dev/null || true
