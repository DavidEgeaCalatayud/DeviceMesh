name: Android CI
on:
  push:
    branches: [main]
    paths: ["mobile/android/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["mobile/android/**", ".github/workflows/android-ci.yml"]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with: {gradle-version: "8.9"}
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
      - working-directory: mobile/android
        run: gradle :core:network:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease
      - name: Create Android emulator
        run: |
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd             --force --name devicemesh-ci --package "system-images;android-35;google_apis;x86_64"
      - name: Run Android UI tests
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" -avd devicemesh-ci -no-window -no-audio             -no-boot-anim -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          "$ANDROID_HOME/platform-tools/adb" shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
          cd mobile/android
          gradle :app:connectedDebugAndroidTest
