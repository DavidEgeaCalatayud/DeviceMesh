name: Performance acceptance

on:
  pull_request:
    paths:
      - "backend/**"
      - "infra/**"
      - "tools/benchmarking/**"
      - ".github/workflows/performance-acceptance.yml"
  workflow_dispatch:
    inputs:
      devices:
        description: Number of authenticated agents
        required: true
        default: "100"
        type: choice
        options: ["10", "100", "1000"]
      rounds:
        description: Heartbeat + telemetry rounds per agent
        required: true
        default: "5"
        type: choice
        options: ["3", "5", "10"]

permissions:
  contents: read

jobs:
  ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEVICE_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.devices || '10' }}
      ROUND_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.rounds || '3' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Prepare isolated production configuration
        run: |
          cp .env.production.example .env.production
          sed -i 's/mesh.example.com/mesh.perf.invalid/g' .env.production
          python tools/deployment/config.py --init-secrets
          cat > infra/docker/performance.override.yml <<'YAML'
          services:
            api:
              ports: ["127.0.0.1:18000:8000"]
          YAML
      - name: Start production-format API and worker
        run: |
          docker compose --project-directory . --env-file .env.production \
            -f infra/docker/docker-compose.prod.yml \
            -f infra/docker/performance.override.yml \
            up -d --build --wait --wait-timeout 180 api worker
      - name: Install benchmark client
        run: python -m pip install --disable-pip-version-check "httpx>=0.27,<1"
      - name: Run authenticated ingestion benchmark
        env:
          DEVICEMESH_OPERATOR_TOKEN_FILE: .secrets/operator_token
        run: |
          mkdir -p artifacts
          export DEVICEMESH_OPERATOR_TOKEN="$(cat "$DEVICEMESH_OPERATOR_TOKEN_FILE")"
          python tools/benchmarking/load_test.py \
            --server http://127.0.0.1:18000 \
            --devices "$DEVICE_COUNT" \
            --rounds "$ROUND_COUNT" \
            --concurrency 100 \
            --cleanup \
            --output "artifacts/benchmark-${DEVICE_COUNT}.json"
      - name: Capture container and database evidence
        if: always()
        run: |
          mkdir -p artifacts
          docker stats --no-stream --format '{{json .}}' > artifacts/docker-stats.jsonl || true
          docker compose --project-directory . --env-file .env.production \
            -f infra/docker/docker-compose.prod.yml \
            -f infra/docker/performance.override.yml \
            exec -T postgres psql -U devicemesh_owner -d devicemesh -Atc \
            "SELECT json_build_object('databaseBytes', pg_database_size(current_database()), 'metricSamples', (SELECT count(*) FROM metric_samples), 'devices', (SELECT count(*) FROM devices));" \
            > artifacts/postgres-summary.json || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          name: performance-${{ env.DEVICE_COUNT }}
          path: artifacts/
          if-no-files-found: warn
      - name: Diagnostics
        if: failure()
        run: tools/deployment/compose.sh logs --tail 150
      - name: Teardown
        if: always()
        run: |
          docker compose --project-directory . --env-file .env.production \
            -f infra/docker/docker-compose.prod.yml \
            -f infra/docker/performance.override.yml down -v --remove-orphans
