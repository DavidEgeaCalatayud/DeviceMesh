name: iOS Release

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload the signed IPA to App Store Connect/TestFlight
        required: true
        type: boolean
        default: false
  push:
    tags: ["ios-v*"]

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: macos-26
    env:
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify Xcode 26+
        run: |
          xcodebuild -version
          major="$(xcodebuild -version | awk '/Xcode/{split($2,v,"."); print v[1]}')"
          test "$major" -ge 26
      - run: brew install xcodegen
      - name: Require signing material
        run: |
          test -n "$IOS_CERTIFICATE_P12_BASE64"
          test -n "$IOS_CERTIFICATE_PASSWORD"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"
          test -n "$IOS_TEAM_ID"
      - name: Install signing certificate and profile
        run: |
          KEYCHAIN="$RUNNER_TEMP/devicemesh-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/devicemesh-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/devicemesh.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/devicemesh-profile.plist"

          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "IOS_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Run unit and UI tests before archive
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -project DeviceMesh.xcodeproj \
            -scheme DeviceMesh \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            test CODE_SIGNING_ALLOWED=NO
      - name: Archive signed application
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -project DeviceMesh.xcodeproj \
            -scheme DeviceMesh \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DeviceMesh.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive
      - name: Export signed IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>io.github.davidegeacalatayud.devicemesh</key>
              <string>$IOS_PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          mkdir -p dist/ios
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/DeviceMesh.xcarchive" \
            -exportPath dist/ios \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA="$(find dist/ios -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          shasum -a 256 "$IPA" > dist/ios/SHA256SUMS
          echo "IOS_IPA=$IPA" >> "$GITHUB_ENV"
      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devicemesh-ios-signed
          path: dist/ios/
          if-no-files-found: error
      - name: Upload to App Store Connect
        if: ${{ github.event_name == 'push' || inputs.upload_testflight }}
        run: |
          test -n "$APP_STORE_CONNECT_API_KEY_ID"
          test -n "$APP_STORE_CONNECT_API_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64"
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          chmod 600 "$KEY_DIR/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          xcrun altool \
            --validate-app \
            --file "$IOS_IPA" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
          xcrun altool \
            --upload-app \
            --file "$IOS_IPA" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
      - name: Cleanup signing material
        if: always()
        run: |
          security delete-keychain "$IOS_SIGNING_KEYCHAIN" || true
          rm -rf "$HOME/.appstoreconnect/private_keys" || true
          rm -f "$RUNNER_TEMP/devicemesh-distribution.p12" "$RUNNER_TEMP/devicemesh.mobileprovision" || true
