name: iOS Release

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the signed IPA to App Store Connect
        required: true
        default: false
        type: boolean
  push:
    tags: ["ios-v*"]

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: macos-15
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_API_PRIVATE_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require signing material
        run: |
          set -euo pipefail
          for value in             "$APPLE_TEAM_ID"             "$IOS_CERTIFICATE_P12_BASE64"             "$IOS_CERTIFICATE_PASSWORD"             "$IOS_PROVISIONING_PROFILE_BASE64"             "$IOS_KEYCHAIN_PASSWORD"; do
            test -n "$value"
          done
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Import signing certificate
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/devicemesh-distribution.p12"
          KEYCHAIN="$RUNNER_TEMP/devicemesh-signing.keychain-db"
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list             -S apple-tool:,apple:,codesign:             -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
      - name: Install provisioning profile
        id: profile
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/devicemesh.mobileprovision"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Run unit and UI tests before signing
        working-directory: mobile/ios
        run: |
          xcodebuild             -project DeviceMesh.xcodeproj             -scheme DeviceMesh             -sdk iphonesimulator             -destination 'platform=iOS Simulator,name=iPhone 16'             test CODE_SIGNING_ALLOWED=NO
      - name: Archive signed app
        working-directory: mobile/ios
        run: |
          xcodebuild             -project DeviceMesh.xcodeproj             -scheme DeviceMesh             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$RUNNER_TEMP/DeviceMesh.xcarchive"             DEVELOPMENT_TEAM="$APPLE_TEAM_ID"             CODE_SIGN_STYLE=Manual             PROVISIONING_PROFILE_SPECIFIER="${{ steps.profile.outputs.name }}"             CODE_SIGN_IDENTITY="Apple Distribution"             archive
      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>io.github.davidegeacalatayud.devicemesh</key>
              <string>${{ steps.profile.outputs.name }}</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          mkdir -p dist/ios
          xcodebuild             -exportArchive             -archivePath "$RUNNER_TEMP/DeviceMesh.xcarchive"             -exportPath dist/ios             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA="$(find dist/ios -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          cp "$IPA" dist/ios/DeviceMesh.ipa
          shasum -a 256 dist/ios/DeviceMesh.ipa > dist/ios/SHA256SUMS
          codesign --verify --deep --strict "$RUNNER_TEMP/DeviceMesh.xcarchive/Products/Applications/DeviceMesh.app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devicemesh-ios-signed
          path: |
            dist/ios/DeviceMesh.ipa
            dist/ios/SHA256SUMS
          if-no-files-found: error
      - name: Upload to App Store Connect
        if: startsWith(github.ref, 'refs/tags/ios-v') || inputs.upload_to_testflight
        run: |
          set -euo pipefail
          test -n "$APPSTORE_API_KEY_ID"
          test -n "$APPSTORE_ISSUER_ID"
          test -n "$APPSTORE_API_PRIVATE_KEY_BASE64"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPSTORE_API_PRIVATE_KEY_BASE64" | base64 --decode             > "$HOME/.appstoreconnect/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8"
          xcrun altool             --upload-app             --type ios             --file dist/ios/DeviceMesh.ipa             --apiKey "$APPSTORE_API_KEY_ID"             --apiIssuer "$APPSTORE_ISSUER_ID"
