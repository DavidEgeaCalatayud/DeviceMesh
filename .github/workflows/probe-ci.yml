name: Network Probe CI
on:
  push:
    paths: ["agents/probe/**", ".github/workflows/probe-ci.yml"]
  pull_request:
    paths: ["agents/probe/**", ".github/workflows/probe-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - working-directory: agents/probe
        run: pip install -e ".[dev]"
      - working-directory: agents/probe
        run: ruff check devicemesh_probe tests
      - working-directory: agents/probe
        run: pytest
