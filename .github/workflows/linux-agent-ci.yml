name: Linux Agent CI
on:
  push:
    paths: ["agents/linux/**", "protocol/**", ".github/workflows/linux-agent-ci.yml"]
  pull_request:
    paths: ["agents/linux/**", "protocol/**", ".github/workflows/linux-agent-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/linux/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check . ../tests
      - run: mypy devicemesh_linux_agent.py
      - run: pytest -q
