name: Backend CI
on:
  push:
    paths: ["backend/**", "protocol/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "protocol/**", ".github/workflows/backend-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devicemesh
          POSTGRES_USER: devicemesh
          POSTGRES_PASSWORD: devicemesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devicemesh -d devicemesh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DEVICEMESH_DATABASE_URL: postgresql+psycopg://devicemesh:devicemesh@localhost:5432/devicemesh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip
      - working-directory: backend
        run: pip install -e ".[dev]"
      - working-directory: backend
        run: alembic upgrade head
      - working-directory: backend
        run: ruff check app tests
      - working-directory: backend
        run: mypy app
      - working-directory: backend
        run: pytest --cov=app --cov-report=term-missing
