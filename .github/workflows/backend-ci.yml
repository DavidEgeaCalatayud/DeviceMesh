name: Backend CI
on:
  push:
    branches: [main]
    paths: ["backend/**", "protocol/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "protocol/**", ".github/workflows/backend-ci.yml"]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devicemesh
          POSTGRES_USER: devicemesh
          POSTGRES_PASSWORD: devicemesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devicemesh -d devicemesh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DEVICEMESH_DATABASE_URL: postgresql+psycopg://devicemesh:devicemesh@localhost:5432/devicemesh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip
      - working-directory: backend
        run: pip install -e ".[dev]"
      - working-directory: backend
        run: alembic upgrade head
      - id: ruff
        working-directory: backend
        run: |
          set +e
          ruff check app tests --output-format=json > ../ruff-report.json
          status=$?
          cat ../ruff-report.json
          exit "$status"
      - if: failure() && steps.ruff.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-ruff-report
          path: ruff-report.json
      - id: mypy
        working-directory: backend
        run: |
          set +e
          mypy app --show-error-codes --no-color-output > ../mypy-report.txt 2>&1
          status=$?
          cat ../mypy-report.txt
          exit "$status"
      - if: failure() && steps.mypy.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-mypy-report
          path: mypy-report.txt
      - working-directory: backend
        run: pytest --cov=app --cov-report=term-missing
