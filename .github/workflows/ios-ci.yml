name: iOS CI
on:
  push:
    branches: [main]
    paths: ["mobile/ios/**", ".github/workflows/ios-ci.yml"]
  pull_request:
    paths: ["mobile/ios/**", ".github/workflows/ios-ci.yml"]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: brew install xcodegen
      - working-directory: mobile/ios
        run: xcodegen generate
      - working-directory: mobile/ios
        run: xcodebuild -project DeviceMesh.xcodeproj -scheme DeviceMesh -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
      - name: Run iOS unit tests
        working-directory: mobile/ios
        run: xcodebuild -project DeviceMesh.xcodeproj -scheme DeviceMesh -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16' test CODE_SIGNING_ALLOWED=NO
