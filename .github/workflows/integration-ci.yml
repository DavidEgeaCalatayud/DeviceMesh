name: Integration CI
on:
  pull_request:
    paths: ["backend/**", "web/**", "infra/**", "protocol/**", ".github/workflows/integration-ci.yml"]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose -f infra/docker/docker-compose.yml up -d --build
      - run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker compose -f infra/docker/docker-compose.yml logs
          exit 1
      - if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v
