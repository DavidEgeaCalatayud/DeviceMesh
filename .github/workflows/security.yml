name: Security

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesystem:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  python-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Audit locked backend dependencies
        run: |
          python -m pip install --disable-pip-version-check "pip-audit>=2.9,<3"
          pip-audit --require-hashes -r backend/requirements.lock

  web-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Reject high or critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high

  dotnet-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "8.0.x"}
      - name: Reject vulnerable transitive Windows agent packages
        shell: bash
        run: |
          dotnet restore agents/windows/DeviceMesh.Agent.sln
          output="$(dotnet list agents/windows/DeviceMesh.Agent.sln package --vulnerable --include-transitive)"
          printf '%s\n' "$output"
          if grep -Eq '^\s*>\s' <<<"$output"; then
            echo "Vulnerable .NET packages were reported" >&2
            exit 1
          fi

  protocol-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install hash-locked backend and contract tooling
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock
          python -m pip install --disable-pip-version-check "pytest>=8.4,<9" "jsonschema[format]>=4.25,<5"
      - name: Exercise protocol schema and mutation boundaries
        working-directory: backend
        run: pytest -q tests/contract
