name: Security

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject mutable remote action references
        run: python tools/security/check_pinned_actions.py

  filesystem:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  python-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Audit locked backend dependencies
        run: |
          python -m pip install --disable-pip-version-check "pip-audit>=2.9,<3"
          pip-audit --require-hashes -r backend/requirements.lock

  web-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Reject high or critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high

  dotnet-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: {dotnet-version: "8.0.x"}
      - name: Reject vulnerable transitive Windows agent packages
        shell: bash
        run: |
          dotnet restore agents/windows/DeviceMesh.Agent.sln
          output="$(dotnet list agents/windows/DeviceMesh.Agent.sln package --vulnerable --include-transitive)"
          printf '%s\n' "$output"
          if grep -Eq '^\s*>\s' <<<"$output"; then
            echo "Vulnerable .NET packages were reported" >&2
            exit 1
          fi

  protocol-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Install hash-locked backend and contract tooling
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock
          python -m pip install --disable-pip-version-check "pytest>=8.4,<9" "jsonschema[format]>=4.25,<5" "hypothesis>=6.138,<7"
      - name: Exercise protocol schema, mutation and fuzz boundaries
        working-directory: backend
        env:
          HYPOTHESIS_PROFILE: ci
        run: pytest -q tests/contract
