name: Documentation CI
on:
  pull_request:
    paths:
      - "backend/app/api/**"
      - "backend/app/main.py"
      - "docs/**"
      - "tools/docs/**"
      - ".github/workflows/docs-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/api/**"
      - "backend/app/main.py"
      - "docs/**"
      - "tools/docs/**"
      - ".github/workflows/docs-ci.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  api-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip
      - working-directory: backend
        run: pip install -e .
      - name: Render API endpoint catalog
        run: python tools/docs/render_api_catalog.py --output /tmp/ENDPOINT_CATALOG.md
      - name: Verify committed endpoint catalog is current
        run: diff -u docs/api/ENDPOINT_CATALOG.md /tmp/ENDPOINT_CATALOG.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: generated-api-catalog
          path: /tmp/ENDPOINT_CATALOG.md
