name: Documentation CI
on:
  pull_request:
    paths:
      - "backend/app/api/**"
      - "backend/app/main.py"
      - "docs/**"
      - "tools/docs/**"
      - ".github/workflows/docs-ci.yml"
  push:
    paths:
      - "backend/app/api/**"
      - "backend/app/main.py"
      - "docs/**"
      - "tools/docs/**"
      - ".github/workflows/docs-ci.yml"
permissions:
  contents: read
jobs:
  api-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip
      - working-directory: backend
        run: pip install -e .
      - name: Render API endpoint catalog
        run: python tools/docs/render_api_catalog.py --output /tmp/ENDPOINT_CATALOG.md
      - name: Verify committed endpoint catalog is current
        run: diff -u docs/api/ENDPOINT_CATALOG.md /tmp/ENDPOINT_CATALOG.md
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: generated-api-catalog
          path: /tmp/ENDPOINT_CATALOG.md
