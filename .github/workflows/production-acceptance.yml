name: Production acceptance
on:
  push:
    branches: [main]
    paths: ["backend/**", "web/**", "infra/**", "observability/**", "tools/deployment/**", ".github/workflows/production-acceptance.yml"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  restore-and-realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Prepare isolated configuration
        run: |
          cp .env.production.example .env.production
          sed -i 's/mesh.example.com/mesh.ci.invalid/g' .env.production
          python tools/deployment/config.py --init-secrets
          cat > infra/docker/acceptance.override.yml <<'YAML'
          services:
            api:
              ports: ["127.0.0.1:18000:8000"]
            web:
              ports: ["127.0.0.1:15173:8080"]
            proxy:
              volumes:
                - ./infra/caddy/Caddyfile.acceptance:/etc/caddy/Caddyfile:ro
          YAML
      - name: Build and start migrated production services
        run: |
          docker compose --project-directory . --env-file .env.production -f infra/docker/docker-compose.prod.yml -f infra/docker/acceptance.override.yml up -d --build --wait --wait-timeout 180 api worker web prometheus grafana proxy
      - name: Verify trusted HTTPS production edge
        run: |
          set -euo pipefail
          proxy_id="$(docker compose --project-directory . --env-file .env.production -f infra/docker/docker-compose.prod.yml -f infra/docker/acceptance.override.yml ps -q proxy)"
          for attempt in {1..30}; do
            if docker exec "$proxy_id" test -f /data/caddy/pki/authorities/local/root.crt; then break; fi
            if [[ "$attempt" == 30 ]]; then docker logs "$proxy_id"; exit 1; fi
            sleep 1
          done
          docker cp "$proxy_id:/data/caddy/pki/authorities/local/root.crt" /tmp/devicemesh-caddy-root.crt
          HTTPS=(curl --fail --silent --show-error --cacert /tmp/devicemesh-caddy-root.crt --resolve mesh.ci.invalid:443:127.0.0.1)
          "${HTTPS[@]}" https://mesh.ci.invalid/ready | grep -q '"status":"ready"'
          "${HTTPS[@]}" https://mesh.ci.invalid/ >/tmp/devicemesh-web.html
          test -s /tmp/devicemesh-web.html
          token="$(cat .secrets/operator_token)"
          "${HTTPS[@]}" -H "Authorization: Bearer $token" https://mesh.ci.invalid/api/v1/system/version \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d["apiVersion"] == 1 and d["schemaRevision"]'
          headers="$(curl --silent --show-error --cacert /tmp/devicemesh-caddy-root.crt --resolve mesh.ci.invalid:443:127.0.0.1 -D - -o /dev/null https://mesh.ci.invalid/ready | tr -d '\r')"
          grep -qi '^strict-transport-security: max-age=31536000$' <<<"$headers"
          grep -qi '^x-frame-options: DENY$' <<<"$headers"
          grep -qi '^x-content-type-options: nosniff$' <<<"$headers"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --cacert /tmp/devicemesh-caddy-root.crt --resolve mesh.ci.invalid:443:127.0.0.1 https://mesh.ci.invalid/metrics)"
          test "$status" = "404"
      - name: Authenticated enrollment to realtime inventory
        run: |
          pip install httpx websockets
          python tools/deployment/acceptance.py --token-file .secrets/operator_token
          curl --fail http://localhost:15173/
      - name: Verify bundled observability
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9090/-/ready >/dev/null && curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 2
          done
          check_prometheus() {
            local encoded_query="$1"
            curl --fail --silent "http://127.0.0.1:9090/api/v1/query?query=${encoded_query}" \
              | python -c 'import json,sys; d=json.load(sys.stdin); assert d["status"] == "success" and d["data"]["result"] and d["data"]["result"][0]["value"][1] == "1", d'
          }
          for attempt in {1..30}; do
            if check_prometheus 'up%7Bjob%3D%22devicemesh-api%22%7D' && check_prometheus 'up%7Bjob%3D%22devicemesh-worker%22%7D'; then break; fi
            if [[ "$attempt" == 30 ]]; then exit 1; fi
            sleep 2
          done
          curl --fail --silent 'http://127.0.0.1:9090/api/v1/rules' \
            | python -c 'import json,sys; d=json.load(sys.stdin); names={r["name"] for g in d["data"]["groups"] for r in g["rules"]}; expected={"DeviceMeshApiUnavailable","DeviceMeshWorkerUnavailable","DeviceMeshSchedulerWithoutLeader","DeviceMeshSyntheticWorkerStalled","DeviceMeshElevatedHttpErrors","devicemesh:http_error_ratio5m"}; missing=expected-names; assert d["status"] == "success" and not missing, f"missing rules: {sorted(missing)}"'
          for attempt in {1..30}; do
            dashboards="$(curl --fail --silent http://127.0.0.1:3000/api/search?query=DeviceMesh -u admin:$(cat .secrets/grafana_admin_password) | python -c 'import json,sys; print(len(json.load(sys.stdin)))')"
            if [[ "$dashboards" -ge 2 ]]; then break; fi
            if [[ "$attempt" == 30 ]]; then echo "Expected at least two provisioned dashboards, got $dashboards" >&2; exit 1; fi
            sleep 2
          done
      - name: Restore a production-format backup into an isolated database
        run: tools/deployment/verify-backup.sh
      - name: Restart and verify persisted canary through HTTPS
        run: |
          set -euo pipefail
          tools/deployment/compose.sh restart api worker
          HTTPS=(curl --fail --silent --show-error --cacert /tmp/devicemesh-caddy-root.crt --resolve mesh.ci.invalid:443:127.0.0.1)
          for attempt in {1..30}; do
            if "${HTTPS[@]}" https://mesh.ci.invalid/ready >/dev/null; then break; fi
            if [[ "$attempt" == 30 ]]; then exit 1; fi
            sleep 2
          done
          token="$(cat .secrets/operator_token)"
          "${HTTPS[@]}" -H "Authorization: Bearer $token" https://mesh.ci.invalid/api/v1/service-catalog \
            | python -c 'import json,sys; services=json.load(sys.stdin); assert any(service["name"] == "acceptance-canary" for service in services)'
      - if: failure()
        run: tools/deployment/compose.sh logs --tail 120
      - if: always()
        run: tools/deployment/compose.sh down -v
