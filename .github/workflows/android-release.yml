name: Android Release

on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      DEVICEMESH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      DEVICEMESH_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      DEVICEMESH_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with: {gradle-version: "8.9"}
      - name: Require production signing material
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$DEVICEMESH_ANDROID_KEYSTORE_PASSWORD"
          test -n "$DEVICEMESH_ANDROID_KEY_ALIAS"
          test -n "$DEVICEMESH_ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/devicemesh-release.jks"
          echo "DEVICEMESH_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/devicemesh-release.jks" >> "$GITHUB_ENV"
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Test and build signed artifacts
        working-directory: mobile/android
        run: gradle :core:network:testDebugUnitTest :app:lintRelease :app:bundleRelease :app:assembleRelease
      - name: Verify signed APK and checksums
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose mobile/android/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist/android
          cp mobile/android/app/build/outputs/apk/release/app-release.apk dist/android/DeviceMesh.apk
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab dist/android/DeviceMesh.aab
          (cd dist/android && sha256sum DeviceMesh.apk DeviceMesh.aab > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devicemesh-android-signed
          path: dist/android/
          if-no-files-found: error
