name: Release Validation
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devicemesh-api:${GITHUB_REF_NAME} backend
  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "8.0.x"}
      - run: dotnet publish agents/windows/src/DeviceMesh.Agent.Host/DeviceMesh.Agent.Host.csproj -c Release -o artifacts/windows-agent
      - uses: actions/upload-artifact@v4
        with: {name: windows-agent, path: artifacts/windows-agent}
