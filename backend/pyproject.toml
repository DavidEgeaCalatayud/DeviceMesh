[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "devicemesh-backend"
version = "0.1.0"
description = "DeviceMesh API and device ingestion service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<7",
  "httpx>=0.28,<1",
  "argon2-cffi>=25.1,<26",
  "prometheus-client>=0.22,<1",
  "pysnmp==7.1.30",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.138,<7",
  "jsonschema[format]>=4.25,<5",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.13,<1",
  "mypy>=1.18,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true


[[tool.mypy.overrides]]
module = ["pysnmp.*"]
ignore_missing_imports = true
