[project]
name = "devicemesh-backend"
version = "0.1.0"
description = "DeviceMesh API and device ingestion service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<7",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "jsonschema[format]>=4.25,<5",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.13,<1",
  "mypy>=1.18,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
