global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: devicemesh-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/operator_token
    static_configs:
      - targets: ["api:8000"]

  - job_name: devicemesh-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]
