[project]
name = "devicemesh-linux-agent"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "psutil>=7,<8"]

[project.optional-dependencies]
dev = ["mypy>=1.18,<2", "pytest>=8.4,<9", "ruff>=0.13,<1"]

[project.scripts]
devicemesh-linux-agent = "devicemesh_linux_agent:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["../tests"]
