[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "devicemesh-probe"
version = "0.2.0"
description = "Bounded DeviceMesh network discovery and distributed synthetic probe"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.13,<1"]

[project.scripts]
devicemesh-probe = "devicemesh_probe.__main__:main"

[tool.setuptools.packages.find]
include = ["devicemesh_probe*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
